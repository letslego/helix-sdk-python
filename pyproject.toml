[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "letslego-helix"
version = "0.1.0"
description = "Python SDK for the Helix HTTP API (/helix/v1) — sessions, approvals, workflows, events."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "LetsLego" }]
keywords = ["helix", "agents", "sdk", "ai-agents", "letslego"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/letslego/helix-sdk-python"
Repository = "https://github.com/letslego/helix-sdk-python"
Ecosystem = "https://letslego.github.io/helix-ecosystem/"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/helix_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
